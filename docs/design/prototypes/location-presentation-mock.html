<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Location presentation — options</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e7e9f1;font-family:Poppins,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:#2b2f45}
  .stage{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:28px 18px 56px;flex-wrap:wrap}
  .phone{width:360px;height:748px;background:#fff;border-radius:38px;overflow:hidden;position:relative;
         box-shadow:0 40px 90px -40px rgba(40,44,80,.6),0 0 0 9px #1a1d2b;flex:0 0 auto}
  .scroll{position:absolute;inset:0;overflow-y:auto}
  .scroll::-webkit-scrollbar{width:0}

  .hero{position:relative;height:150px;padding:44px 20px 0;background:#F0C33C;border-radius:0 0 28px 28px}
  .hero .nm{color:#fff;font-size:22px;font-weight:600}
  .hero .no{position:absolute;right:20px;top:50px;color:rgba(255,255,255,.82);font-size:12.5px;font-weight:700}
  .hero .art{position:absolute;right:16px;bottom:-14px;width:104px;height:104px;background-size:contain;
             background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 12px 16px rgba(0,0,0,.25));
             animation:artIn .55s cubic-bezier(.22,.9,.24,1) both}
  .tabs{display:flex;gap:20px;padding:14px 20px 0;border-bottom:1.5px solid #f0f2f8}
  .tab{font-size:12px;font-weight:600;color:#b0b4c6;padding-bottom:10px}
  .tab.on{color:#2b2f45;border-bottom:2.5px solid #2b2f45}

  .body{padding:16px 16px 40px}
  .sect{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:#b0b4c6;margin:14px 0 9px 2px}

  .pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .pill{font-size:10.5px;font-weight:600;padding:6px 12px;border-radius:999px;color:#fff;animation:pop .4s both}

  .card{background:#fff;border:1.5px solid #f0f2f8;border-radius:16px;padding:4px 13px;animation:rise .45s both}
  .loc{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #f6f7fb}
  .loc:last-child{border-bottom:0}
  .loc .l{font-size:12px}
  .loc .m{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
  .game{font-size:10.5px;font-weight:700;color:#9095ad;margin:12px 0 2px 2px}

  .acc{background:#fff;border:1.5px solid #f0f2f8;border-radius:14px;margin-bottom:8px;overflow:hidden;animation:rise .4s both}
  .acch{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;cursor:pointer;font-size:11.5px;font-weight:600}
  .acch .c{font-size:10px;color:#b0b4c6;transition:transform .25s}
  .accb{padding:0 13px 6px}

  /* availability strip */
  .strip{background:#fff;border:1.5px solid #f0f2f8;border-radius:16px;padding:14px 13px;animation:rise .45s both}
  .erow{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;margin-bottom:11px}
  .elab{font-size:9px;font-weight:700;color:#b0b4c6;line-height:1.25}
  .dots{display:flex;gap:5px;flex-wrap:wrap}
  .dot{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
       font-size:8px;font-weight:700;color:#fff;cursor:pointer;animation:pop .38s both}
  .dot.none{background:#f0f2f8;color:#c8ccda}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid #f6f7fb}
  .lg{display:flex;align-items:center;gap:5px;font-size:9.5px;color:#9095ad}
  .lg i{width:9px;height:9px;border-radius:3px;display:block}

  /* game picker */
  .region{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .rg{font-size:10.5px;font-weight:600;padding:7px 13px;border-radius:999px;border:1.5px solid #eceef5;color:#9095ad;background:#fff}
  .rg.on{background:#5C4EE5;border-color:#5C4EE5;color:#fff}
  .ggrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .gcard{border-radius:14px;padding:13px 12px;color:#fff;font-size:12px;font-weight:600;animation:rise .42s both;cursor:pointer}
  .gcard small{display:block;font-size:9px;opacity:.8;font-weight:500;margin-top:3px}

  .chip{display:inline-flex;align-items:center;gap:6px;background:#2b2f45;color:#fff;font-size:10.5px;
        font-weight:600;padding:6px 12px;border-radius:999px}

  /* empty states */
  .empty{background:#fff;border:1.5px solid #f0f2f8;border-radius:16px;padding:26px 18px;text-align:center;animation:rise .45s both}
  .empty .ic{font-size:26px;margin-bottom:9px}
  .empty .t{font-size:13px;font-weight:600;margin-bottom:6px}
  .empty .d{font-size:11.5px;color:#9095ad;line-height:1.55}

  .panel{width:290px;flex:0 0 auto;padding-top:4px}
  .panel h3{font-size:14px;margin:0 0 4px}
  .panel p{font-size:12.5px;line-height:1.6;color:#5b6079;margin:0 0 14px}
  .glab{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#b0b4c6;margin-bottom:7px}
  .opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .opt{border:1.5px solid #dcdfeb;background:#fff;border-radius:11px;padding:8px 12px;font-family:inherit;
       font-size:11.5px;font-weight:600;cursor:pointer;color:#6d7288}
  .opt.on{background:#2b2f45;border-color:#2b2f45;color:#fff}
  .note{font-size:11.5px;line-height:1.6;color:#6d7288;background:#fff;border-radius:14px;padding:13px 14px;border:1.5px solid #f0f2f8}
  .note b{color:#2b2f45}

  @keyframes artIn{from{opacity:0;transform:translateY(18px) scale(.88)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.74)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="scroll" id="screen"></div></div>
  <div class="panel">
    <h3>Location presentation</h3>
    <p>Four views. The first two are alternative Location tabs on the Pokémon detail; the third is the standalone Locations tile; the fourth is the two empty states.</p>
    <div class="glab">VIEW</div>
    <div class="opts" id="nav"></div>
    <div class="note" id="explain"></div>
  </div>
</div>

<script>
const SP=n=>'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+n+'.png';
const M={wild:['Wild','#3FAE72'],gift:['Gift','#C58B3C'],raid:['Raid','#5C4EE5'],
         trade:['Trade','#C05C8E'],none:['—','#c8ccda']};

const CURRENT=[
  {g:'Sword / Shield',rows:[['Route 3','wild'],['Rolling Fields','wild'],['Max Raid Dens','raid']]}
];
const ERAS=[
  {e:'3DS Era (Gen 6–7)',games:[
    {g:'X / Y',rows:[['Route 3','wild'],['Santalune Forest','wild']]},
    {g:'Sun / Moon',rows:[['Route 1','wild'],["Hau'oli City",'wild']]},
    {g:'Omega Ruby / Alpha Sapphire',rows:[['Safari Zone','wild']]}]},
  {e:'DS Era (Gen 4–5)',games:[
    {g:'Diamond / Pearl',rows:[['Trophy Garden','wild']]},
    {g:'HeartGold / SoulSilver',rows:[['Viridian Forest','wild']]}]},
  {e:'GBA Era (Gen 3)',games:[
    {g:'FireRed / LeafGreen',rows:[['Viridian Forest','wild'],['Power Plant','wild']]}]},
  {e:'GB / GBC Era (Gen 1–2)',games:[
    {g:'Red / Blue',rows:[['Viridian Forest','wild'],['Power Plant','wild']]},
    {g:'Yellow',rows:[['Starter — Pallet Town','gift']]}]}
];
const STRIP=[
  {e:'Switch',games:[['SwSh','wild'],['BDSP','none'],['LA','none'],['SV','none']]},
  {e:'3DS',games:[['XY','wild'],['ORAS','wild'],['SM','wild'],['USUM','wild']]},
  {e:'DS',games:[['DP','wild'],['Pt','wild'],['HGSS','wild'],['BW','none']]},
  {e:'GBA',games:[['RSE','none'],['FRLG','wild']]},
  {e:'GB',games:[['RB','wild'],['Y','gift'],['GSC','wild']]}
];

let view='flat', open='3DS Era (Gen 6–7)';

const VIEWS={
  flat:{label:'1 · Flat + eras',desc:'<b>Location tab, as designed.</b> Capture pills, then Sword/Shield flat, then collapsed era accordions. <b>No game picker</b> — the question here is "where can I get this", and the cross-game summary is the answer.'},
  strip:{label:'2 · Availability strip',desc:'<b>Location tab, alternative.</b> Generations as rows, games as dots coloured by capture method. Answers "which of my games has this" at a glance and scales to 30+ games without scrolling. Tapping a dot drills into that game.'},
  picker:{label:'3 · Locations tile',desc:'<b>Standalone Locations tile.</b> "What is on this route" is meaningless without a game, so it asks up front. The chip is <b>sticky</b> — remembered across sessions, and never leaks into any other screen.'},
  empty:{label:'4 · Empty states',desc:'<b>Two states, not one.</b> Conflating them would be actively misleading: Gen 9 is missing data, whereas Arceus is a fact. 17.5% of species are the second case.'}
};

function pills(list){return '<div class="pills">'+list.map((p,i)=>
  '<div class="pill" style="background:'+M[p][1]+';animation-delay:'+(i*.06).toFixed(2)+'s">'+
  ({wild:'Wild Catch',gift:'Gift / Event',raid:'Raid',trade:'Trade'}[p])+'</div>').join('')+'</div>';}

function rows(list){return list.map(r=>'<div class="loc"><span class="l">'+r[0]+
  '</span><span class="m" style="background:'+M[r[1]][1]+'">'+M[r[1]][0]+'</span></div>').join('');}

function hero(name,no,id,color,tab){
  return '<div class="hero" style="background:'+color+'"><div class="nm">'+name+'</div><div class="no">'+no+'</div>'
   +'<div class="art" style="background-image:url('+SP(id)+')"></div></div>'
   +'<div class="tabs"><div class="tab">About</div><div class="tab">Base Stats</div>'
   +'<div class="tab'+(tab?' on':'')+'">Location</div><div class="tab">Moves</div></div>';
}

function render(){
  let h='';
  if(view==='flat'){
    h=hero('Pikachu','#025',25,'#F0C33C',1)+'<div class="body">'
     +pills(['wild','raid','gift'])
     +'<div class="sect">CURRENT — SWORD / SHIELD</div>'
     +CURRENT.map(c=>'<div class="game">'+c.g+'</div><div class="card">'+rows(c.rows)+'</div>').join('')
     +'<div class="sect">EARLIER GAMES</div>'
     +ERAS.map((er,i)=>{const o=open===er.e;
        return '<div class="acc" style="animation-delay:'+(i*.05).toFixed(2)+'s"><div class="acch" onclick="tog(\''+er.e+'\')">'
        +'<span>'+er.e+'</span><span class="c" style="transform:rotate('+(o?180:0)+'deg)">▾</span></div>'
        +(o?'<div class="accb">'+er.games.map(g=>'<div class="game">'+g.g+'</div><div class="card" style="border:0;padding:0 0 4px">'+rows(g.rows)+'</div>').join('')+'</div>':'')
        +'</div>';}).join('')
     +'</div>';
  }
  else if(view==='strip'){
    h=hero('Pikachu','#025',25,'#F0C33C',1)+'<div class="body">'
     +pills(['wild','raid','gift'])
     +'<div class="sect">AVAILABILITY</div><div class="strip">'
     +STRIP.map((s,i)=>'<div class="erow"><div class="elab">'+s.e+'</div><div class="dots">'
        +s.games.map((g,j)=>'<div class="dot'+(g[1]==='none'?' none':'')+'" style="'
        +(g[1]==='none'?'':'background:'+M[g[1]][1])+';animation-delay:'+((i*4+j)*.03).toFixed(2)+'s">'+g[0]+'</div>').join('')
        +'</div></div>').join('')
     +'<div class="legend">'+['wild','gift','raid'].map(k=>'<div class="lg"><i style="background:'+M[k][1]+'"></i>'
        +({wild:'Wild',gift:'Gift / Event',raid:'Raid'}[k])+'</div>').join('')
        +'<div class="lg"><i style="background:#f0f2f8"></i>Not available</div></div>'
     +'</div>'
     +'<div class="sect">SWORD / SHIELD</div><div class="card">'+rows(CURRENT[0].rows)+'</div>'
     +'</div>';
  }
  else if(view==='picker'){
    h='<div class="hero" style="background:#7A5BC9;height:126px"><div class="nm">Locations</div></div>'
     +'<div class="body"><div style="margin-bottom:14px"><span class="chip">🎮 Sword / Shield · change</span></div>'
     +'<div class="sect">REGION</div>'
     +'<div class="region">'+['Galar','Kanto','Johto','Hoenn','Sinnoh'].map((r,i)=>
        '<div class="rg'+(i===0?' on':'')+'">'+r+'</div>').join('')+'</div>'
     +'<div class="sect">CHOOSE A GAME</div>'
     +'<div class="ggrid">'+[['Sword','#5BA7F7','Galar'],['Shield','#E8685D','Galar'],
        ['Brilliant Diamond','#6ECBD2','Sinnoh'],['Shining Pearl','#EE97CE','Sinnoh'],
        ['Legends: Arceus','#9DB945','Hisui'],['Scarlet','#FF9D5C','Paldea']].map((g,i)=>
        '<div class="gcard" style="background:'+g[1]+';animation-delay:'+(i*.05).toFixed(2)+'s">'+g[0]
        +'<small>'+g[2]+'</small></div>').join('')+'</div></div>';
  }
  else {
    h=hero('Sprigatito','#906',906,'#5BC98F',1)+'<div class="body">'
     +pills(['gift'])
     +'<div class="sect">LOCATION</div>'
     +'<div class="empty"><div class="ic">🗺️</div><div class="t">No encounter data yet</div>'
     +'<div class="d">Paldea route data isn\'t available from our source yet. This is a gap in the data, not a Pokémon you can\'t catch.</div></div>'
     +'<div class="sect" style="margin-top:26px">COMPARE — ARCEUS</div>'
     +'<div class="empty"><div class="ic">✨</div><div class="t">Never found in the wild</div>'
     +'<div class="d">Arceus cannot be encountered on any route in any game. Obtained through events only.</div></div>'
     +'</div>';
  }
  document.getElementById('screen').innerHTML=h;
  document.getElementById('nav').innerHTML=Object.keys(VIEWS).map(k=>
    '<button class="opt'+(k===view?' on':'')+'" onclick="setV(\''+k+'\')">'+VIEWS[k].label+'</button>').join('');
  document.getElementById('explain').innerHTML=VIEWS[view].desc;
}
function setV(v){view=v;render()}
function tog(e){open=open===e?null:e;render()}
render();
</script>
</body>
</html>
