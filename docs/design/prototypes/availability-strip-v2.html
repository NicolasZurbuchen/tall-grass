<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Availability strip v2</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e7e9f1;font-family:Poppins,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:#2b2f45}
  .stage{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:28px 18px 56px;flex-wrap:wrap}
  .phone{width:360px;height:748px;background:#fff;border-radius:38px;overflow:hidden;position:relative;
         box-shadow:0 40px 90px -40px rgba(40,44,80,.6),0 0 0 9px #1a1d2b;flex:0 0 auto}
  .scroll{position:absolute;inset:0;overflow-y:auto}
  .scroll::-webkit-scrollbar{width:0}

  .hero{position:relative;height:142px;padding:44px 20px 0;background:#F0C33C;border-radius:0 0 28px 28px}
  .hero .nm{color:#fff;font-size:22px;font-weight:600}
  .hero .no{position:absolute;right:20px;top:50px;color:rgba(255,255,255,.82);font-size:12.5px;font-weight:700}
  .hero .art{position:absolute;right:16px;bottom:-16px;width:100px;height:100px;background-size:contain;
             background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 12px 16px rgba(0,0,0,.25))}
  .tabs{display:flex;gap:20px;padding:14px 20px 0;border-bottom:1.5px solid #f0f2f8}
  .tab{font-size:12px;font-weight:600;color:#b0b4c6;padding-bottom:10px}
  .tab.on{color:#2b2f45;border-bottom:2.5px solid #2b2f45}

  .body{padding:14px 16px 40px}
  .sect{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:#b0b4c6;margin:14px 0 9px 2px}

  .strip{background:#fff;border:1.5px solid #f0f2f8;border-radius:16px;padding:14px 13px}
  .erow{margin-bottom:14px}
  .erow:last-of-type{margin-bottom:4px}
  .elab{font-size:9px;font-weight:700;color:#b0b4c6;margin-bottom:7px;letter-spacing:.05em}
  .games{display:flex;gap:6px;flex-wrap:wrap}

  /* readable game chip */
  .gc{position:relative;border-radius:10px;padding:7px 9px 7px;min-width:62px;cursor:pointer;
      border:1.5px solid #eceef5;background:#fff;animation:pop .38s both;overflow:hidden}
  .gc .gn{font-size:10px;font-weight:700;color:#2b2f45;line-height:1.2;position:relative;z-index:2}
  .gc.off{background:#f7f8fc;border-color:#f0f2f8}
  .gc.off .gn{color:#c2c6d6}
  .gc.sel{border-color:#2b2f45;box-shadow:0 4px 12px -6px rgba(40,44,80,.5)}

  /* strategy 1: binary fill */
  .gc.bin{border-color:transparent}
  /* strategy 2: segmented underline */
  .segs{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:6px;position:relative;z-index:2}
  .segs i{flex:1;display:block}
  /* strategy 3: primary + pips */
  .pips{display:flex;gap:2.5px;margin-top:6px;position:relative;z-index:2}
  .pips i{width:5px;height:5px;border-radius:50%;display:block}

  .legend{display:flex;gap:11px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid #f6f7fb}
  .lg{display:flex;align-items:center;gap:5px;font-size:9.5px;color:#9095ad}
  .lg i{width:9px;height:9px;border-radius:3px;display:block}

  .detail{background:#fff;border:1.5px solid #f0f2f8;border-radius:16px;padding:4px 13px;margin-top:10px}
  .loc{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f6f7fb}
  .loc:last-child{border-bottom:0}
  .loc .l{font-size:11.5px}
  .loc .m{font-size:9px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
  .dnone{font-size:11.5px;color:#9095ad;padding:14px 0;text-align:center}

  .panel{width:300px;flex:0 0 auto;padding-top:4px}
  .panel h3{font-size:14px;margin:0 0 4px}
  .panel p{font-size:12.5px;line-height:1.6;color:#5b6079;margin:0 0 14px}
  .glab{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#b0b4c6;margin-bottom:7px}
  .opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .opt{border:1.5px solid #dcdfeb;background:#fff;border-radius:11px;padding:8px 12px;font-family:inherit;
       font-size:11.5px;font-weight:600;cursor:pointer;color:#6d7288}
  .opt.on{background:#2b2f45;border-color:#2b2f45;color:#fff}
  .note{font-size:11.5px;line-height:1.6;color:#6d7288;background:#fff;border-radius:14px;padding:13px 14px;border:1.5px solid #f0f2f8}
  .note b{color:#2b2f45}

  @keyframes pop{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="scroll" id="screen"></div></div>
  <div class="panel">
    <h3>Availability strip v2</h3>
    <p>Readable game names, no abbreviations, no logos. Three ways of showing <b>how</b> you get it. Tap any game to see its routes.</p>
    <div class="glab">COLOUR STRATEGY</div>
    <div class="opts" id="nav"></div>
    <div class="glab">GROUPING</div>
    <div class="opts" id="grp"></div>
    <div class="note" id="explain"></div>
  </div>
</div>

<script>
const SP=n=>'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+n+'.png';
const M={wild:['Wild','#3FAE72'],raid:['Raid','#5C4EE5'],gift:['Gift','#C58B3C'],trade:['Trade','#C05C8E']};

// name, generation, console era, methods[], routes[]
const GAMES=[
 ['Sword',8,'Switch',['wild','raid'],[['Route 3','wild'],['Rolling Fields','wild'],['Max Raid Dens','raid']]],
 ['Shield',8,'Switch',['wild','raid'],[['Route 3','wild'],['Max Raid Dens','raid']]],
 ["Let's Go",7,'Switch',['wild','gift','trade'],[['Viridian Forest','wild'],['Partner','gift'],['Route 4 trade','trade']]],
 ['BD / SP',8,'Switch',[],[]],
 ['Legends A.',8,'Switch',[],[]],
 ['Scarlet',9,'Switch',[],[]],
 ['Violet',9,'Switch',[],[]],
 ['X / Y',6,'3DS',['wild'],[['Route 3','wild'],['Santalune Forest','wild']]],
 ['OR / AS',6,'3DS',['wild'],[['Safari Zone','wild']]],
 ['Sun / Moon',7,'3DS',['wild'],[['Route 1','wild'],["Hau'oli City",'wild']]],
 ['US / UM',7,'3DS',['wild'],[['Route 1','wild']]],
 ['Diamond',4,'DS',['wild'],[['Trophy Garden','wild']]],
 ['Pearl',4,'DS',['wild'],[['Trophy Garden','wild']]],
 ['Platinum',4,'DS',['wild'],[['Trophy Garden','wild']]],
 ['HG / SS',4,'DS',['wild'],[['Viridian Forest','wild']]],
 ['Black',5,'DS',[],[]],
 ['White',5,'DS',[],[]],
 ['FR / LG',3,'GBA',['wild'],[['Viridian Forest','wild'],['Power Plant','wild']]],
 ['Ruby / Sap.',3,'GBA',[],[]],
 ['Emerald',3,'GBA',[],[]],
 ['Red / Blue',1,'GB',['wild'],[['Viridian Forest','wild'],['Power Plant','wild']]],
 ['Yellow',1,'GB',['gift'],[['Starter — Pallet Town','gift']]],
 ['Gold / Sil.',2,'GB',['wild'],[['Route 2','wild']]]
];

const STRAT={
 bin:{label:'1 · Binary',desc:'<b>Availability only.</b> Filled means obtainable, grey means not. The <i>how</i> lives in the detail below, not in the chip. Immune to the multi-method problem entirely — a Pokémon obtainable six ways looks the same as one obtainable once.'},
 seg:{label:'2 · Segmented',desc:'<b>A split bar under each name</b>, one segment per method. Shows all ways at once and stays honest at two or three. Four-plus segments become slivers — Let\'s Go already has three.'},
 pip:{label:'3 · Primary + pips',desc:'<b>Bar shows the primary method</b> (wild beats raid beats gift beats trade); pips count how many ways total. Scales to any number, but you must tap to learn what the extra ways are.'}
};
const GRP={
 gen:{label:'Generation',desc:'Canonical and familiar — players say "Gen 5", not "the DS one".'},
 con:{label:'Console era',desc:'Proxy for "can I still play this". Groups differently: Let\'s Go is Gen 7 but a Switch game.'}
};

let strat='bin', group='gen', sel='Sword';
const GENLAB={1:'Gen 1–2',2:'Gen 1–2',3:'Gen 3',4:'Gen 4',5:'Gen 5',6:'Gen 6',7:'Gen 7',8:'Gen 8',9:'Gen 9'};

function chip(g){
  const [name,gen,con,methods]=g;
  const on=methods.length>0, isSel=sel===name;
  let inner='<div class="gn">'+name+'</div>';
  let cls='gc'+(on?'':' off')+(isSel?' sel':'');
  let style='';
  if(!on){ /* grey */ }
  else if(strat==='bin'){
    cls+=' bin'; style='background:'+M[methods[0]][1]+'1f;border-color:'+M[methods[0]][1]+'66';
    inner='<div class="gn" style="color:#2b2f45">'+name+'</div>';
  }
  else if(strat==='seg'){
    inner+='<div class="segs">'+methods.map(m=>'<i style="background:'+M[m][1]+'"></i>').join('')+'</div>';
  }
  else {
    inner+='<div class="segs"><i style="background:'+M[methods[0]][1]+'"></i></div>'
      +'<div class="pips">'+methods.map((m,i)=>'<i style="background:'+(i===0?M[methods[0]][1]:'#d8dbe6')+'"></i>').join('')+'</div>';
  }
  return '<div class="'+cls+'" style="'+style+'" onclick="pick(\''+name+'\')">'+inner+'</div>';
}

function render(){
  const keyOf=g=>group==='gen'?GENLAB[g[1]]:g[2]+' era';
  const order=[]; const buckets={}; const rank={};
  for(const g of GAMES){
    const k=keyOf(g);
    if(!buckets[k]){buckets[k]=[];order.push(k);rank[k]=g[1];}
    rank[k]=Math.max(rank[k],g[1]);
    buckets[k].push(g);
  }
  // generation buckets sort newest-first; console buckets keep hardware order
  if(group==='gen') order.sort((a,b)=>rank[b]-rank[a]);

  const s=GAMES.find(g=>g[0]===sel);
  const detail = s && s[4].length
    ? s[4].map(r=>'<div class="loc"><span class="l">'+r[0]+'</span><span class="m" style="background:'+M[r[1]][1]+'">'+M[r[1]][0]+'</span></div>').join('')
    : '<div class="dnone">Not obtainable in '+(s?s[0]:'—')+'.</div>';

  document.getElementById('screen').innerHTML=
   '<div class="hero"><div class="nm">Pikachu</div><div class="no">#025</div>'
   +'<div class="art" style="background-image:url('+SP(25)+')"></div></div>'
   +'<div class="tabs"><div class="tab">About</div><div class="tab">Base Stats</div>'
   +'<div class="tab on">Location</div><div class="tab">Moves</div></div>'
   +'<div class="body"><div class="sect">AVAILABILITY</div><div class="strip">'
   + order.map(k=>'<div class="erow"><div class="elab">'+k.toUpperCase()+'</div><div class="games">'
       + buckets[k].map(chip).join('')+'</div></div>').join('')
   + (strat==='bin'
      ? '<div class="legend"><div class="lg"><i style="background:#3FAE72"></i>Obtainable</div><div class="lg"><i style="background:#f0f2f8"></i>Not available</div></div>'
      : '<div class="legend">'+Object.keys(M).map(k=>'<div class="lg"><i style="background:'+M[k][1]+'"></i>'+M[k][0]+'</div>').join('')
        +'<div class="lg"><i style="background:#f0f2f8"></i>Not available</div></div>')
   +'</div>'
   +'<div class="sect">'+(s?s[0].toUpperCase():'')+'</div><div class="detail">'+detail+'</div>'
   +'</div>';

  document.getElementById('nav').innerHTML=Object.keys(STRAT).map(k=>
    '<button class="opt'+(k===strat?' on':'')+'" onclick="setS(\''+k+'\')">'+STRAT[k].label+'</button>').join('');
  document.getElementById('grp').innerHTML=Object.keys(GRP).map(k=>
    '<button class="opt'+(k===group?' on':'')+'" onclick="setG(\''+k+'\')">'+GRP[k].label+'</button>').join('');
  document.getElementById('explain').innerHTML=STRAT[strat].desc+'<br><br>'+GRP[group].desc;
}
function setS(v){strat=v;render()}
function setG(v){group=v;render()}
function pick(n){sel=n;render()}
render();
</script>
</body>
</html>
