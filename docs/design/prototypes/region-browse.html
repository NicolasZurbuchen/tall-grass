</style>

 ['furret',162,4,['time-morning']],['furret',162,1,['time-morning']],
 ['rattata',19,4,['time-night']],['rattata',19,1,['time-night']],
 ['hoothoot',163,5,['time-night']],['hoothoot',163,5,['time-night']],['hoothoot',163,4,['time-night']],['hoothoot',163,1,['time-night']]
];
const AXES=[
 ['Time',['time-morning','time-day','time-night'],['Morning','Day','Night']],
 ['Swarm',['swarm-no','swarm-yes'],['No swarm','Swarm']],
 ['Radio',['radio-off','radio-hoenn','radio-sinnoh'],['Radio off','Hoenn','Sinnoh']]
];
// null on an axis means "any" — the table then shows the best case across every state still possible
let cond=[null,null,null], condOpen=false;
const condExact=()=>cond.every(c=>c!==null);

function statesMatching(){
  const opts=AXES.map((a,i)=>cond[i]?[cond[i]]:a[1]);
  const out=[];
  for(const t of opts[0]) for(const s of opts[1]) for(const r of opts[2]) out.push([t,s,r]);
  return out;
}

function slotTable(){
  const best={};
  for(const st of statesMatching()){
    const agg={};
    for(const s of SLOTS){
      if(!s[3].every(c=>st.includes(c))) continue;
      agg[s[0]]=agg[s[0]]||{id:s[1],ch:0}; agg[s[0]].ch+=s[2];
    }
    for(const k in agg){ if(!best[k]||agg[k].ch>best[k].ch) best[k]={id:agg[k].id,ch:agg[k].ch}; }
  }
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  return Object.entries(best).sort((a,b)=>b[1].ch-a[1].ch)
    .map(([k,v])=>[v.id,cap(k),'Lv 2–4',v.ch]);
}

let view='regions', rtab='About', locSel=null, mtab='Walking', q='', rlay='mascot', place='Route 1';

const NAV={regions:'Region list',region:'Kanto',location:'Route 1'};
const EXPL={
 regions:'<b>Region list.</b> Eleven regions, each carrying facts derived straight from the API — generation, regional Pokédex size, location count, number of games set there. The Japanese name is free in <code>names[]</code> and adds character at zero cost.',
 region:'<b>Region detail, three tabs.</b> Same tab idiom as the Pokémon detail. <b>About</b> holds the wiki-ish facts plus one hand-written blurb — eleven of those is trivial to write and, being original, sidesteps the flavour-text copyright problem. <b>Locations</b> is the searchable list. <b>Pokédex</b> reuses the existing dex grid, filtered to the regional dex.',
 location:'<b>Location detail.</b> The <b>same availability grid component</b> as the Pokémon side, pointed at a route instead. Tap a game, it collapses to a breadcrumb, and the encounter list appears — method tabs here because one route yields many Pokémon, and rate bars <b>scoped to the active method</b> so they always sum to 100%.'
};

function head(title,sub,color,jp,back){
  return '<div class="hd'+(back?' ind':'')+'" style="background:'+color+'">'
   +(back?'<div class="bk" onclick="go(\''+back+'\')">←</div>':'')
   +(jp?'<div class="jp">'+jp+'</div>':'')
   +'<div class="deco"></div><div class="deco2"></div>'
   +'<div class="t">'+title+'</div><div class="s">'+sub+'</div></div>';
}

function render(){
  let h='';
  if(view==='regions'){
    h=head('Regions','Eleven worlds, eleven Pokédex','#5C4EE5','')+'<div class="body">';
    if(rlay==='flat'){
      h+=REGIONS.map((r,i)=>'<div class="rcard" style="background:'+r[2]+';animation-delay:'+(i*.04).toFixed(2)
        +'s" onclick="'+(r[0]==='Kanto'?'go(\'region\')':'')+'">'
        +'<div class="rb"></div><div class="rj">'+r[1]+'</div>'
        +'<div class="rn">'+r[0]+'</div><div class="rs">'+r[3]+' &middot; '+r[4]+' &middot; '+r[6]+' games</div></div>').join('');
    }
    else if(rlay==='mascot'){
      h+='<div class="mgrid">'+REGIONS.map((r,i)=>{
        const pair=r[7];
        const art=pair.map((id,j)=>'<div class="mart'+(pair.length>1?(j?' b':' a'):' solo')
          +'" style="background-image:url('+SP(id)+');animation-delay:'+(j*.6).toFixed(1)+'s"></div>').join('');
        return '<div class="mcard" style="background:'+r[2]+';animation-delay:'+(i*.05).toFixed(2)+'s" onclick="'
        +(r[0]==='Kanto'?'go(\'region\')':'')+'" title="'+r[9]+'">'
        +'<div class="mglow"></div>'+art
        +'<div class="mjp">'+r[1]+'</div>'
        +'<div class="mn">'+r[0]+'</div><div class="ms">'+r[3]+' &middot; '+r[4]+'</div></div>';
      }).join('')+'</div>'
      +'<div class="scope">Box-art pair per region &mdash; no arbitrary "defining game" pick to defend. <b>Hisui</b> and <b>Orre</b> have no legendary pair and fall back (Arceus; Espeon + Umbreon from Colosseum). There is no API field for box art &mdash; this is a hand-authored 11-row table.</div>';
    }
    else{
      h+=REGIONS.map((r,i)=>'<div class="scard" style="animation-delay:'+(i*.04).toFixed(2)+'s" onclick="'
        +(r[0]==='Kanto'?'go(\'region\')':'')+'">'
        +'<div class="sband" style="background:'+r[2]+'"></div>'
        +'<div class="strio">'+(r[8].length?r[8].map((s,j)=>'<div class="stri" style="background-image:url('+SP(s)
          +');z-index:'+(3-j)+';margin-left:'+(j?-14:0)+'px"></div>').join(''):'<div class="stri" style="background-image:url('+SP(r[7])+')"></div>')+'</div>'
        +'<div style="flex:1"><div class="sn">'+r[0]+'</div><div class="ss">'+r[3]+' &middot; '+r[4]+' &middot; '+r[6]+' games</div></div>'
        +'<div class="sjp">'+r[1]+'</div></div>').join('');
    }
    h+='</div>';
  }
  else if(view==='region'){
    const tabs=['About','Locations','Pokédex'];
    h=head('Kanto','Generation I &middot; 9 games','#E8685D','カントー','regions')
     +'<div class="tabs">'+tabs.map(t=>'<div class="tab'+(t===rtab?' on':'')+'" onclick="setTab(\''+t+'\')">'+t+'</div>').join('')+'</div>'
     +'<div class="body">';
    if(rtab==='About'){
      h+='<div class="stats">'
       +[['151','POKÉDEX'],['96','LOCATIONS'],['9','GAMES']].map((s,i)=>
         '<div class="st" style="animation-delay:'+(i*.06).toFixed(2)+'s"><div class="v">'+s[0]+'</div><div class="k">'+s[1]+'</div></div>').join('')
       +'</div>'
       +'<div class="lore">The region where it started. A long eastern peninsula of quiet towns, dense forest and a volcanic island in the south — compact enough to cross on foot, and the only region revisited in a later generation.</div>'
       +'<div class="sect">DETAILS</div><div class="card">'
       +[['Introduced','Generation I'],['Native name','カントー'],
         ['Regional Pokédex','151 species'],['Second Pokédex','Let’s Go Kanto'],
         ['Games set here','Red · Blue · Yellow · FireRed · LeafGreen · Let’s Go'],
         ['Also reachable in','Gold · Silver · Crystal · HeartGold · SoulSilver']]
        .map(k=>'<div class="kv"><span class="k">'+k[0]+'</span><span class="v">'+k[1]+'</span></div>').join('')
       +'</div>';
    }
    else if(rtab==='Locations'){
      const list=KANTO_LOCS.filter(l=>l[0].toLowerCase().includes(q.toLowerCase()));
      h+='<input class="search" placeholder="Search 96 locations…" value="'+q+'" oninput="setQ(this.value)">'
       + list.map((l,i)=>'<div class="lrow" style="animation-delay:'+(i*.03).toFixed(2)+'s" onclick="'
          +(l[0]==='Route 1'?'go(\'location\')':'')+'">'
          +'<div class="ic" style="background:'+LICON[l[1]]+'22">'+l[2]+'</div>'
          +'<div style="flex:1"><div class="ln">'+l[0]+'</div><div class="lg">'+l[3]+'</div></div>'
          +'<div class="cv">›</div></div>').join('')
       +'<div class="scope">Showing '+list.length+' of 96. Berry Forest and the Sevii Islands appear here even though only FireRed and LeafGreen have data for them — that absence is itself information.</div>';
    }
    else{
      h+='<div class="dex">'+DEX.map((d,i)=>'<div class="dcard" style="background:'+d[2]
        +';background-image:url('+SP(d[0])+');animation-delay:'+(i*.04).toFixed(2)+'s">'+d[1]+'</div>').join('')+'</div>'
       +'<div class="scope"><b>#037 is the Kantonian Vulpix, not the Alolan one.</b> PokéAPI’s pokedex entries are <i>species-level</i>, so they cannot distinguish forms — the naive implementation silently shows an Alolan Vulpix in the Kanto dex. Rule: in a regional dex, show the variant whose form matches that region, else the default. Kanto → <code>vulpix</code>; Alola → <code>vulpix-alola</code>; National → both cards at #037.<br><br>Otherwise this reuses the main dex grid component, filtered to Kanto’s 151. Nothing new to build.</div>';
    }
    h+='</div>';
  }
  else{
    const P=PLACES[place];
    const g=KANTO_VERSIONS.find(x=>x[0]===locSel);
    const enc=(ENC[place]||{})[locSel]||{};
    const methods=Object.keys(enc);
    const active=methods.includes(mtab)?mtab:methods[0];
    h=head(place,P.sub,'#3FAE72','','region')
     +'<div class="body">'
     +'<div class="sect">AVAILABLE IN &mdash; KANTO GAMES ONLY</div>';
    if(!locSel){
      h+='<div class="grid">'+GROWS.map(r=>'<div class="grow"><div class="glab">'+r+'</div><div class="cells">'
        +KANTO_VERSIONS.filter(v=>v[2]===r).map((v,i)=>'<div class="cell'+(P.has.includes(v[0])?'':' no')
          +'" style="animation-delay:'+(i*.02).toFixed(2)
          +'s" onclick="pickGame(\''+v[0]+'\')">'+v[0]+'</div>').join('')+'</div></div>').join('')+'</div>'
        +'<div class="scope">Twelve cells, not thirty. Sword, Scarlet and Diamond are not Kanto games, so they are never shown &mdash; derived from the region&rsquo;s version groups. Kanto has no 3DS game, so that row does not exist at all.</div>';
    } else {
      h+='<div class="bar" onclick="pickGame(null)"><div class="tok">'+g[0]+'</div>'
       +'<div class="tx"><div class="t1">'+g[1]+'</div><div class="t2">'+g[2]
       +' &middot; '+(methods.length?methods.join(', '):'no data')+'</div></div><div class="cv">▲</div></div>';
      if(methods.length){
        const isSlots=enc[active]==='SLOTS';
        const rows=isSlots?slotTable():enc[active];
        h+='<div class="mtabs">'+methods.map(m=>'<div class="mt'+(m===active?' on':'')
          +'" style="'+(m===active?'background:'+MCOL[m]:'')+'" onclick="setM(\''+m+'\')">'+m+'</div>').join('')+'</div>';
        if(isSlots){
          const any=cond.every(c=>c===null);
          const label=any?'Any conditions'
            :AXES.map((a,i)=>cond[i]?a[2][a[1].indexOf(cond[i])]:'Any').join(' &middot; ');
          h+='<div class="cbar'+(any?'':' set')+'" onclick="toggleCond()"><span class="cl">CONDITIONS</span>'
           +'<span class="cv2">'+label+'</span>'
           +'<span class="cc" style="transform:rotate('+(condOpen?180:0)+'deg)">▾</span></div>';
          if(condOpen){
            h+='<div class="caxes">'+AXES.map((a,i)=>'<div class="cax"><div class="caxl">'+a[0]+'</div><div class="caxo">'
              +'<div class="co'+(cond[i]===null?' on':'')+'" onclick="setCond('+i+',null)">Any</div>'
              +a[1].map((v,j)=>'<div class="co'+(cond[i]===v?' on':'')+'" onclick="setCond('+i+',\''+v+'\')">'
              +a[2][j]+'</div>').join('')+'</div></div>').join('')+'</div>';
          }
        }
        h+='<div class="card">'+rows.map((e,i)=>
            '<div class="erow"><div class="sp" style="background-image:url('+SP(e[0])+')"></div>'
            +'<div style="flex:1"><div class="en">'+e[1]+'</div><div class="el">'+e[2]+'</div></div>'
            +'<div class="rt"><div class="rv" style="color:'+MCOL[active]+'">'
              +(e[3]?(isSlots&&!condExact()?'<span class="upto">up to </span>':'')+e[3]+'%':'—')+'</div>'
            +'<div class="track"><div class="fill" style="width:'+e[3]+'%;background:'+MCOL[active]
            +';animation-delay:'+(.1+i*.06).toFixed(2)+'s"></div></div></div></div>').join('')+'</div>'
         +'<div class="scope">Tabs are the <b>actual method</b>, never a group &mdash; Old Rod and Good Rod are separate 100% tables, so merging them into one &ldquo;Fishing&rdquo; tab would produce bars summing to 255%.'
         +(isSlots
           ? (condExact()
              ? ' Conditions are fully specified, so these are <b>exact</b> and sum to 100%.'
              : ' Conditions are tags that AND onto individual slots. With an axis left on <b>Any</b>, each figure is the <b>best case</b> across every state still possible &mdash; so they deliberately do not sum to 100%. Pin all three axes for exact numbers. Real PokéAPI slots for HeartGold, computed live.')
           : ' This table is unconditioned, so the figures are exact.')+'</div>';
      } else {
        h+='<div class="scope" style="text-align:center;padding:26px 0;font-size:11.5px">'+place+' does not exist in '+g[1]+'.</div>';
      }
    }
    h+='</div>';
  }
  document.getElementById('screen').innerHTML=h;
  document.getElementById('nav').innerHTML=Object.keys(NAV).map(k=>
    '<button class="opt'+(k===view?' on':'')+'" onclick="go(\''+k+'\')">'+NAV[k]+'</button>').join('');
  document.getElementById('rlayout').innerHTML=[['flat','Flat'],['mascot','Mascot'],['starters','Starter trio']]
    .map(o=>'<button class="opt'+(o[0]===rlay?' on':'')+'" onclick="setLay(\''+o[0]+'\')">'+o[1]+'</button>').join('');
  document.getElementById('placesel').innerHTML=Object.keys(PLACES)
    .map(p=>'<button class="opt'+(p===place?' on':'')+'" onclick="setPlace(\''+p+'\')">'+p+'</button>').join('');
  document.getElementById('explain').innerHTML=EXPL[view];
}
function setLay(l){rlay=l;view='regions';render()}
function toggleCond(){condOpen=!condOpen;render()}
function setCond(i,v){ cond[i]=v; render(); }
function setPlace(p){place=p;locSel=null;view='location';render()}
function go(v){view=v;render()}
function setTab(t){rtab=t;render()}
function setQ(v){q=v;render();const i=document.querySelector('.search');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}
function pickGame(g){locSel=g;render()}
function setM(m){mtab=m;render()}
render();
</script>
</body>
</html>
