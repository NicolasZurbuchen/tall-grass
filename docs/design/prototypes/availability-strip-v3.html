<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Location layout — v3</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e7e9f1;font-family:Poppins,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:#2b2f45}
  .stage{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:28px 18px 56px;flex-wrap:wrap}
  .phone{width:360px;height:748px;background:#fff;border-radius:38px;overflow:hidden;position:relative;
         box-shadow:0 40px 90px -40px rgba(40,44,80,.6),0 0 0 9px #1a1d2b;flex:0 0 auto}
  .scroll{position:absolute;inset:0;overflow-y:auto}
  .scroll::-webkit-scrollbar{width:0}

  .hero{position:relative;height:132px;padding:42px 20px 0;background:#F0C33C;border-radius:0 0 26px 26px}
  .hero .nm{color:#fff;font-size:21px;font-weight:600}
  .hero .no{position:absolute;right:20px;top:48px;color:rgba(255,255,255,.82);font-size:12px;font-weight:700}
  .hero .art{position:absolute;right:16px;bottom:-16px;width:92px;height:92px;background-size:contain;
             background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 12px 16px rgba(0,0,0,.25))}
  .tabs{display:flex;gap:18px;padding:12px 20px 0;border-bottom:1.5px solid #f0f2f8}
  .tab{font-size:11.5px;font-weight:600;color:#b0b4c6;padding-bottom:9px}
  .tab.on{color:#2b2f45;border-bottom:2.5px solid #2b2f45}

  .body{padding:12px 16px 40px}
  .sect{font-size:9px;font-weight:700;letter-spacing:.09em;color:#b0b4c6;margin:12px 0 8px 2px}
  .pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
  .pill{font-size:10px;font-weight:600;padding:5px 11px;border-radius:999px;color:#fff}

  /* ---------- A: era tabs + game chips (sticky) ---------- */
  .picker{position:sticky;top:0;z-index:9;background:#fff;padding:8px 0 10px;border-bottom:1.5px solid #f0f2f8;margin:0 -16px;padding-left:16px;padding-right:16px}
  .eras{display:flex;gap:4px;margin-bottom:9px}
  .era{flex:1;text-align:center;padding:7px 2px 6px;border-radius:10px;cursor:pointer;position:relative;
       font-size:10px;font-weight:700;color:#9095ad;background:#f6f7fb}
  .era.on{background:#2b2f45;color:#fff}
  .era .av{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:#3FAE72}
  .era.on .av{background:#6be0a8}
  .era .av.no{background:#d8dbe6}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{border-radius:9px;padding:6px 10px;font-size:10px;font-weight:700;cursor:pointer;
        border:1.5px solid #eceef5;background:#fff;color:#2b2f45;animation:pop .3s both}
  .chip.off{background:#f7f8fc;border-color:#f0f2f8;color:#c2c6d6}
  .chip.sel{background:#3FAE72;border-color:#3FAE72;color:#fff}
  .chip.sel.off{background:#b0b4c6;border-color:#b0b4c6;color:#fff}

  /* ---------- B: sticky horizontal rail ---------- */
  .rail{position:sticky;top:0;z-index:9;background:#fff;margin:0 -16px;padding:9px 16px 10px;border-bottom:1.5px solid #f0f2f8;
        overflow-x:auto;white-space:nowrap}
  .rail::-webkit-scrollbar{height:0}
  .rgroup{display:inline-block;margin-right:14px;vertical-align:top}
  .rglab{font-size:8px;font-weight:700;color:#c2c6d6;letter-spacing:.08em;margin-bottom:5px}
  .rchips{display:flex;gap:5px}

  /* ---------- C: accordion list ---------- */
  .arow{border:1.5px solid #f0f2f8;border-radius:13px;margin-bottom:7px;overflow:hidden;background:#fff;animation:rise .35s both}
  .ah{display:flex;align-items:center;gap:9px;padding:12px 13px;cursor:pointer}
  .ah .an{font-size:12px;font-weight:600;flex:1}
  .ah .ast{font-size:9px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
  .ah .cv{font-size:9px;color:#c2c6d6;transition:transform .28s cubic-bezier(.22,.9,.24,1)}
  .ab{padding:0 13px 8px}
  .aera{font-size:8.5px;font-weight:700;letter-spacing:.08em;color:#c2c6d6;margin:12px 0 6px 3px}

  .detail{background:#fff;border:1.5px solid #f0f2f8;border-radius:15px;padding:3px 13px;margin-top:10px}
  .loc{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f6f7fb}
  .loc:last-child{border-bottom:0}
  .loc .l{font-size:11.5px}
  .loc .m{font-size:8.5px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
  .dnone{font-size:11.5px;color:#9095ad;padding:16px 0;text-align:center}

  .panel{width:300px;flex:0 0 auto;padding-top:4px}
  .panel h3{font-size:14px;margin:0 0 4px}
  .panel p{font-size:12.5px;line-height:1.6;color:#5b6079;margin:0 0 14px}
  .glab{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#b0b4c6;margin-bottom:7px}
  .opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .opt{border:1.5px solid #dcdfeb;background:#fff;border-radius:11px;padding:8px 12px;font-family:inherit;
       font-size:11.5px;font-weight:600;cursor:pointer;color:#6d7288}
  .opt.on{background:#2b2f45;border-color:#2b2f45;color:#fff}
  .note{font-size:11.5px;line-height:1.6;color:#6d7288;background:#fff;border-radius:14px;padding:13px 14px;border:1.5px solid #f0f2f8}
  .note b{color:#2b2f45}

  @keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slidein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><div class="scroll" id="screen"></div></div>
  <div class="panel">
    <h3>Location layout — v3</h3>
    <p>Three answers to the scroll ping-pong. In all three the selector stays reachable without scrolling back up.</p>
    <div class="glab">LAYOUT</div>
    <div class="opts" id="nav"></div>
    <div class="note" id="explain"></div>
  </div>
</div>

<script>
const SP=n=>'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+n+'.png';
const M={wild:['Wild','#3FAE72'],raid:['Raid','#5C4EE5'],gift:['Gift','#C58B3C'],trade:['Trade','#C05C8E']};
const ERAS=['Switch','3DS','DS','GBA','GB'];

const GAMES=[
 ['Sword','Switch',[['Route 3','wild'],['Rolling Fields','wild'],['Max Raid Dens','raid']]],
 ['Shield','Switch',[['Route 3','wild'],['Max Raid Dens','raid']]],
 ["Let's Go",'Switch',[['Viridian Forest','wild'],['Partner','gift'],['Route 4 trade','trade']]],
 ['BD / SP','Switch',[]],
 ['Legends A.','Switch',[]],
 ['Scarlet','Switch',[]],
 ['Violet','Switch',[]],
 ['X / Y','3DS',[['Route 3','wild'],['Santalune Forest','wild']]],
 ['OR / AS','3DS',[['Safari Zone','wild']]],
 ['Sun / Moon','3DS',[['Route 1','wild'],["Hau'oli City",'wild']]],
 ['US / UM','3DS',[['Route 1','wild']]],
 ['Diamond','DS',[['Trophy Garden','wild']]],
 ['Pearl','DS',[['Trophy Garden','wild']]],
 ['Platinum','DS',[['Trophy Garden','wild']]],
 ['HG / SS','DS',[['Viridian Forest','wild']]],
 ['Black','DS',[]],
 ['White','DS',[]],
 ['FR / LG','GBA',[['Viridian Forest','wild'],['Power Plant','wild']]],
 ['Ruby / Sap.','GBA',[]],
 ['Emerald','GBA',[]],
 ['Red / Blue','GB',[['Viridian Forest','wild'],['Power Plant','wild']]],
 ['Yellow','GB',[['Starter — Pallet Town','gift']]],
 ['Gold / Sil.','GB',[['Route 2','wild']]]
];
const has=n=>{const g=GAMES.find(x=>x[0]===n);return g&&g[2].length>0};
const eraHas=e=>GAMES.some(g=>g[1]===e&&g[2].length);

const L={
 tabs:{label:'A · Era tabs',desc:'<b>Sticky two-row picker.</b> Era tabs carry an availability dot, so the five-dot glance survives; game chips below change with the era. Selector is ~96px and <b>pinned</b> — detail scrolls underneath and you never scroll back up. Switching game inside an era is zero-scroll.'},
 rail:{label:'B · Sticky rail',desc:'<b>One horizontal row, pinned.</b> All 23 games on a single ~62px line, grouped with inline era labels. Swipe sideways to move through history; detail updates in place. Most compact, but you cannot see all games at once.'},
 acc:{label:'C · Accordion list',desc:'<b>Your dropdown idea, done properly.</b> Full-width rows, one expands at a time, others auto-collapse so total height never grows. Not an antipattern when it is a true accordion — but 23 rows is a long scroll, and the expanded row can end up off-screen.'}
};

let layout='tabs', era='Switch', sel='Sword', openRow='Sword';

function detailFor(name){
  const g=GAMES.find(x=>x[0]===name);
  if(!g||!g[2].length) return '<div class="dnone">Not obtainable in '+(g?g[0]:'—')+'.</div>';
  return g[2].map(r=>'<div class="loc"><span class="l">'+r[0]+'</span><span class="m" style="background:'
    +M[r[1]][1]+'">'+M[r[1]][0]+'</span></div>').join('');
}
function pillRow(){return '<div class="pills">'+['wild','raid','gift','trade'].map(k=>
  '<div class="pill" style="background:'+M[k][1]+'">'+({wild:'Wild Catch',raid:'Raid',gift:'Gift / Event',trade:'Trade'}[k])+'</div>').join('')+'</div>';}

function head(){
  return '<div class="hero"><div class="nm">Pikachu</div><div class="no">#025</div>'
   +'<div class="art" style="background-image:url('+SP(25)+')"></div></div>'
   +'<div class="tabs"><div class="tab">About</div><div class="tab">Base Stats</div>'
   +'<div class="tab on">Location</div><div class="tab">Moves</div></div>';
}

function render(){
  let inner='';
  if(layout==='tabs'){
    const gs=GAMES.filter(g=>g[1]===era);
    inner='<div class="picker"><div class="eras">'
      + ERAS.map(e=>'<div class="era'+(e===era?' on':'')+'" onclick="setEra(\''+e+'\')">'
        +'<span class="av'+(eraHas(e)?'':' no')+'"></span>'+e+'</div>').join('')
      +'</div><div class="chips">'
      + gs.map((g,i)=>'<div class="chip'+(g[2].length?'':' off')+(sel===g[0]?' sel':'')
        +'" style="animation-delay:'+(i*.03).toFixed(2)+'s" onclick="pick(\''+g[0]+'\')">'+g[0]+'</div>').join('')
      +'</div></div>'
      +'<div class="sect">'+sel.toUpperCase()+'</div>'
      +'<div class="detail" style="animation:slidein .3s both">'+detailFor(sel)+'</div>'
      +'<div class="sect">HOW YOU GET IT</div>'+pillRow();
  }
  else if(layout==='rail'){
    inner='<div class="rail">'
      + ERAS.map(e=>'<div class="rgroup"><div class="rglab">'+e.toUpperCase()+'</div><div class="rchips">'
        + GAMES.filter(g=>g[1]===e).map(g=>'<div class="chip'+(g[2].length?'':' off')+(sel===g[0]?' sel':'')
          +'" onclick="pick(\''+g[0]+'\')">'+g[0]+'</div>').join('')
        +'</div></div>').join('')
      +'</div>'
      +'<div class="sect">'+sel.toUpperCase()+'</div>'
      +'<div class="detail" style="animation:slidein .3s both">'+detailFor(sel)+'</div>'
      +'<div class="sect">HOW YOU GET IT</div>'+pillRow();
  }
  else{
    inner='';
    for(const e of ERAS){
      inner+='<div class="aera">'+e.toUpperCase()+'</div>';
      inner+=GAMES.filter(g=>g[1]===e).map((g,i)=>{
        const o=openRow===g[0], on=g[2].length>0;
        return '<div class="arow" style="animation-delay:'+(i*.03).toFixed(2)+'s"><div class="ah" onclick="toggle(\''+g[0]+'\')">'
         +'<span class="an" style="'+(on?'':'color:#c2c6d6')+'">'+g[0]+'</span>'
         +(on?'<span class="ast" style="background:#3FAE72">Obtainable</span>':'<span class="ast" style="background:#d8dbe6">—</span>')
         +'<span class="cv" style="transform:rotate('+(o?180:0)+'deg)">▼</span></div>'
         +(o?'<div class="ab" style="animation:slidein .28s both">'+detailFor(g[0])+'</div>':'')+'</div>';
      }).join('');
    }
    inner='<div class="sect">HOW YOU GET IT</div>'+pillRow()+'<div class="sect">BY GAME</div>'+inner;
  }
  document.getElementById('screen').innerHTML=head()+'<div class="body">'+inner+'</div>';
  document.getElementById('nav').innerHTML=Object.keys(L).map(k=>
    '<button class="opt'+(k===layout?' on':'')+'" onclick="setL(\''+k+'\')">'+L[k].label+'</button>').join('');
  document.getElementById('explain').innerHTML=L[layout].desc;
}
function setL(v){layout=v;render()}
function setEra(e){era=e;const f=GAMES.find(g=>g[1]===e&&g[2].length)||GAMES.find(g=>g[1]===e);sel=f[0];render()}
function pick(n){sel=n;render()}
function toggle(n){openRow=openRow===n?null:n;render()}
render();
</script>
</body>
</html>
