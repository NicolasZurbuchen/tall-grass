<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE — game lens</title>
<!--
  PROTOTYPE, throwaway. Ticket: "Prototype the lens: switcher, fallback banner, dex chips, detail header" (#93).
  Three variants of how the lens context is expressed, switchable via ?variant=A|B|C and the bottom bar (or ← →):
    A — Corner chip:   lens is a small chip in the app bar; fallback is a slim strip; dex chips are a row.
    B — Game colour:   the lens game tints the app bar; fallback is a card in the content; dex chips are tabs.
    C — Context bar:   one persistent strip under the app bar carries lens + dex + context; fallback turns it amber.
  Everything decided on map #87 is the same in all three; only where and how the context shows differs.
  Data is a hand-picked handful of Pokémon. Dex numbers, cooldowns and some move values are illustrative.
-->
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e7e9f1;font-family:Poppins,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;color:#2b2f45}
  .stage{display:flex;justify-content:center;padding:24px 16px 90px}
  .phone{width:360px;height:748px;background:#fff;border-radius:38px;overflow:hidden;position:relative;
         box-shadow:0 40px 90px -40px rgba(40,44,80,.6),0 0 0 9px #1a1d2b;flex:0 0 auto}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column}
  .scroll{flex:1;overflow-y:auto}
  .scroll::-webkit-scrollbar{width:0}
  button{font-family:inherit;cursor:pointer}

  /* app bar */
  .ab{display:flex;align-items:center;gap:8px;padding:36px 14px 10px;min-height:78px;background:#fff;transition:background .25s}
  .ab .back{border:0;background:none;font-size:20px;color:inherit;padding:0 4px}
  .ab .ttl{font-size:19px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{border:1.5px solid #e2e5ef;background:#fff;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:600;color:#2b2f45;white-space:nowrap}
  .chip.nat{color:#6b7090}

  /* variant B: game colour */
  .vB .ab.tinted{color:#fff}
  .vB .gamebadge{border:0;border-radius:8px;padding:4px 8px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.18)}
  .vB .gamebadge.nat{background:#eef0f6;color:#6b7090}

  /* variant C: context bar */
  .ctx{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#f4f5fa;border-bottom:1px solid #eceef5;font-size:11px;overflow-x:auto;white-space:nowrap}
  .ctx::-webkit-scrollbar{height:0}
  .ctx .lensbtn{border:0;background:#2b2f45;color:#fff;border-radius:7px;padding:5px 9px;font-size:11px;font-weight:600}
  .ctx .sep{color:#c3c7d6}
  .ctx .dexc{border:0;background:none;padding:3px 2px;font-size:11px;color:#8a8fa8;font-weight:600}
  .ctx .dexc.on{color:#2b2f45;text-decoration:underline;text-underline-offset:4px}
  .ctx.warn{background:#fff3d6;border-bottom-color:#f3dfa8}
  .ctx.warn .lensbtn{background:#b7791f}

  /* banners */
  .strip{background:#fff3d6;color:#7a5410;font-size:11px;padding:7px 14px;border-bottom:1px solid #f3dfa8}
  .bcard{margin:10px 14px 0;border-radius:14px;background:#fff8e6;border:1.5px solid #f3dfa8;padding:11px 12px;font-size:11.5px;color:#6b4a0d;display:flex;gap:10px;align-items:flex-start}
  .bcard b{display:block;font-size:12px;margin-bottom:2px}
  .label{font-size:10px;color:#9095ad;padding:4px 14px 0}

  /* dex chips */
  .dexrow{display:flex;gap:6px;padding:4px 14px 8px;overflow-x:auto}
  .dexrow::-webkit-scrollbar{height:0}
  .dchip{border:1.5px solid #e2e5ef;background:#fff;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:600;color:#6b7090;white-space:nowrap}
  .dchip.on{background:#2b2f45;border-color:#2b2f45;color:#fff}
  .dtabs{display:flex;border-bottom:1.5px solid #f0f2f8;padding:0 10px;overflow-x:auto}
  .dtabs::-webkit-scrollbar{height:0}
  .dtab{border:0;background:none;padding:9px 8px;font-size:11px;font-weight:600;color:#b0b4c6;white-space:nowrap}
  .dtab.on{color:#2b2f45;box-shadow:inset 0 -2.5px 0 #2b2f45}

  /* home */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:8px 16px}
  .tile{border:0;border-radius:16px;height:64px;color:#fff;font-weight:600;font-size:13px;text-align:left;padding:0 14px}
  .note{font-size:10.5px;color:#9095ad;padding:10px 18px;line-height:1.5}

  /* dex grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 14px 20px}
  .card{border:0;border-radius:16px;height:96px;position:relative;text-align:left;padding:10px 10px;color:#fff;overflow:hidden}
  .card .n{font-size:12.5px;font-weight:700}
  .card .num{position:absolute;right:10px;top:9px;font-size:10px;font-weight:700;opacity:.8}
  .card img{position:absolute;right:-4px;bottom:-6px;width:70px;height:70px;object-fit:contain}
  .card .badge{display:inline-block;margin-top:4px;font-size:8.5px;font-weight:700;background:rgba(255,255,255,.28);border-radius:6px;padding:2px 5px}
  .sect{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#b0b4c6;padding:12px 16px 4px;text-transform:uppercase}

  /* detail */
  .hero{position:relative;color:#fff;padding:0 18px 70px;transition:background .25s}
  .hero .nm{font-size:22px;font-weight:700}
  .hero .ctxline{font-size:11px;font-weight:600;opacity:.85;margin-top:2px}
  .hero .types{display:flex;gap:5px;margin-top:6px}
  .tp{font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.28)}
  .hero img{position:absolute;right:12px;bottom:-26px;width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.25))}
  .pills{display:flex;gap:6px;flex-wrap:wrap;padding:14px 16px 2px}
  .pill{border:1.5px solid #e2e5ef;background:#fff;border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:600;color:#2b2f45}
  .pill.on{background:#2b2f45;color:#fff;border-color:#2b2f45}
  .pill.off{color:#c3c7d6;border-style:dashed}
  .pill.off small{display:block;font-size:8px;font-weight:600}
  .sheet{background:#fff;border-radius:26px 26px 0 0;margin-top:-26px;position:relative;min-height:400px}
  .tabs{display:flex;gap:14px;padding:16px 16px 0;border-bottom:1.5px solid #f0f2f8;overflow-x:auto}
  .tabs::-webkit-scrollbar{height:0}
  .tab{border:0;background:none;font-size:11.5px;font-weight:600;color:#b0b4c6;padding:0 0 9px;white-space:nowrap}
  .tab.on{color:#2b2f45;box-shadow:inset 0 -2.5px 0 #2b2f45}
  .body{padding:12px 16px 30px;font-size:12px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #f4f5f9}
  .row .k{color:#9095ad}
  .h{font-size:11px;font-weight:700;margin:12px 0 4px}
  .muted{color:#9095ad;font-size:11px}
  .stat{display:grid;grid-template-columns:62px 30px 1fr;gap:8px;align-items:center;padding:4px 0}
  .stat .bar{height:6px;background:#f0f2f8;border-radius:4px;overflow:hidden}
  .stat .bar i{display:block;height:100%;border-radius:4px}
  .mv{display:grid;grid-template-columns:1fr 56px 44px 44px;gap:6px;padding:7px 0;border-bottom:1px solid #f4f5f9;align-items:baseline}
  .mv.head{font-size:9.5px;color:#9095ad;font-weight:700}
  .mv .sub{display:block;font-size:9px;color:#9095ad}
  .lnk{border:0;background:none;padding:0;color:#3b6fd8;font-weight:600;font-size:inherit;text-align:left}

  /* evolution */
  .evo{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:8px 0}
  .em{border:0;background:#f6f7fb;border-radius:14px;width:84px;padding:6px 4px 7px;text-align:center;font-size:10.5px;font-weight:600;color:#2b2f45}
  .em img{width:52px;height:52px;object-fit:contain;display:block;margin:0 auto}
  .em.off{opacity:.38}
  .em.off small{display:block;font-size:8px}
  .arr{font-size:9px;color:#6b7090;text-align:center;width:62px}
  .arr b{display:block;font-size:13px;color:#b0b4c6}
  .branch{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .branch .cell{text-align:center}
  .branch .em{width:100%}
  .branch .trig{font-size:8.5px;color:#6b7090;min-height:22px;padding:2px}

  /* location */
  .ggrid .gr{display:grid;grid-template-columns:44px 1fr;gap:8px;margin-bottom:8px}
  .ggrid .gl{font-size:8.5px;font-weight:700;color:#b0b4c6;padding-top:7px;text-align:right}
  .cells{display:flex;gap:5px;flex-wrap:wrap}
  .gc{border:0;width:30px;height:30px;border-radius:8px;font-size:9px;font-weight:700;background:#3FAE72;color:#fff}
  .gc.no{background:#f2f4f9;color:#c8ccda}
  .gc.sel{outline:2.5px solid #2b2f45;outline-offset:1.5px}
  .seg{display:inline-flex;border:1.5px solid #e2e5ef;border-radius:10px;overflow:hidden;margin:4px 0 8px}
  .seg button{border:0;background:#fff;padding:5px 14px;font-size:11px;font-weight:600;color:#6b7090}
  .seg button.on{background:#2b2f45;color:#fff}
  .enc{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f4f5f9}
  .mchip{font-size:9px;font-weight:700;background:#eef0f6;border-radius:6px;padding:2px 6px;color:#6b7090;align-self:center}
  .dlc{font-size:8px;font-weight:700;background:#2b2f45;color:#fff;border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:middle}

  /* lists */
  .li{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid #f4f5f9;font-size:12.5px;width:100%;border-left:0;border-right:0;border-top:0;background:#fff;text-align:left}
  .li .meta{font-size:10px;color:#9095ad}
  .empty{padding:40px 26px;text-align:center;color:#6b7090;font-size:12.5px;line-height:1.6}
  .empty .big{font-size:28px;margin-bottom:6px}
  .btn{border:0;background:#2b2f45;color:#fff;border-radius:10px;padding:8px 14px;font-size:11.5px;font-weight:600;margin-top:10px}
  .notin{font-size:9px;font-weight:700;color:#b0b4c6;border:1.2px dashed #d5d8e4;border-radius:6px;padding:1px 5px}
  .search{margin:4px 14px 6px;border:1.5px solid #e2e5ef;border-radius:12px;padding:8px 12px}
  .search input{border:0;outline:0;font-family:inherit;font-size:13px;width:100%}

  /* picker sheet */
  .scrim{position:absolute;inset:0;background:rgba(20,22,40,.45);display:flex;align-items:flex-end;z-index:5}
  .psheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:10px 16px 22px;max-height:82%;overflow-y:auto}
  .psheet .grab{width:36px;height:4px;border-radius:2px;background:#dfe2ec;margin:0 auto 10px}
  .psheet h3{margin:0 0 2px;font-size:15px}
  .psheet .sub{font-size:11px;color:#9095ad;margin-bottom:10px}
  .prow{margin-bottom:10px}
  .prow .pl{font-size:9px;font-weight:700;color:#b0b4c6;letter-spacing:.06em;margin-bottom:5px}
  .prow .opts{display:flex;gap:6px;flex-wrap:wrap}
  .opt{border:1.5px solid #e2e5ef;background:#fff;border-radius:10px;padding:7px 10px;font-size:11px;font-weight:600;color:#2b2f45}
  .opt.on{background:#2b2f45;color:#fff;border-color:#2b2f45}
  .opt.dis{color:#c8ccda;border-style:dashed;cursor:default}
  .setting{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#6b7090;padding:8px 0 0;border-top:1px solid #f0f2f8;margin-top:6px}

  /* prototype switcher bar (not part of the design) */
  .proto{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:6px 8px;display:flex;align-items:center;gap:8px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:50;font-family:system-ui,sans-serif}
  .proto button{background:#333;color:#fff;border:0;border-radius:999px;width:28px;height:28px;font-size:14px}
  .proto .lab{min-width:200px;text-align:center}
  .proto .tag{background:#f5c518;color:#111;border-radius:6px;padding:1px 6px;font-weight:700;margin-right:6px;font-size:10px}
</style>
</head>
<body>
<div class="stage"><div class="phone" id="phone"></div></div>
<div class="proto">
  <span class="tag">PROTOTYPE</span>
  <button id="prev" title="Previous variant (←)">‹</button>
  <span class="lab" id="vlabel"></span>
  <button id="next" title="Next variant (→)">›</button>
</div>
<script>
/* ---------------------------------------------------------------- data */
const ART = id => 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + id + '.png';

// Release order. std = standard mechanics (abilities, PP, accuracy): eligible as a reference game.
const GAMES = [
  { id:'rb',   name:'Red/Blue',          console:'GB',     gen:1, std:true,  abilities:false, megas:false, color:'#C0392B',

  { id:'sv',   name:'Scarlet/Violet',    console:'Switch', gen:9, std:true,  abilities:true,  megas:false, color:'#B03A8C',

// Forms. games = where the form exists. dex = number per (game.dex). Stats current; gen1 adds Special.
const FORMS = {

                     games:['rb','usum','swsh','la'], dex:{ rb:{kanto:95}, swsh:{galar:178}, la:{hisui:84} },

  'steelix':       { sp:'steelix', name:'Steelix', label:'', nat:208, art:208, types:['Steel','Ground'], stats:[75,85,200,55,65,30],
                     games:['usum','swsh','la'], dex:{ swsh:{galar:179}, la:{hisui:85} },
                     abil:['Rock Head','Sturdy','Sheer Force (H)'], evo:'onix' },
  'eevee':         { sp:'eevee', name:'Eevee', label:'', nat:133, art:133, types:['Normal'], stats:[55,55,50,45,65,55], special:65,

                     abil:['Run Away','Adaptability','Anticipation (H)'], evo:'eevee' },
  'growlithe':     { sp:'growlithe', name:'Growlithe', label:'Kanto', nat:58, art:58, types:['Fire'], stats:[55,70,45,70,50,60], special:50,

const SPECIES = ['charizard','clefairy','vulpix','growlithe','onix','eevee','steelix','wooloo'];
const formsOf = sp => Object.keys(FORMS).filter(k => FORMS[k].sp === sp);
const DEFAULT = sp => formsOf(sp)[0];
// "Also in this game": roster species that sit in none of the game's dexes.
const ALSO = { usum:['charizard'], sv:['clefairy','vulpix','onix'] };

// Evolution members (identity). games = where the member exists.
const MEMBERS = {
  charmander:{n:'Charmander', art:4, games:['rb','usum','swsh','sv','za']}, charmeleon:{n:'Charmeleon', art:5, games:['rb','usum','swsh','sv','za']},
  charizard:{n:'Charizard', art:6, slug:'charizard', games:FORMS.charizard.games},
  cleffa:{n:'Cleffa', art:173, games:['usum','swsh','sv','za']}, clefairy:{n:'Clefairy', art:35, slug:'clefairy', games:FORMS.clefairy.games}, clefable:{n:'Clefable', art:36, games:['rb','usum','swsh','sv','za']},
  vulpix:{n:'Vulpix', art:37, slug:'vulpix', games:FORMS.vulpix.games}, ninetales:{n:'Ninetales', art:38, games:['rb','usum','swsh','sv']},
  'vulpix-alola':{n:'Alolan Vulpix', art:10103, slug:'vulpix-alola', games:FORMS['vulpix-alola'].games}, 'ninetales-alola':{n:'Alolan Ninetales', art:10104, games:['usum','swsh','la','sv']},
  growlithe:{n:'Growlithe', art:58, slug:'growlithe', games:FORMS.growlithe.games}, arcanine:{n:'Arcanine', art:59, games:['rb','usum','swsh','sv']},
  'growlithe-hisui':{n:'Hisuian Growlithe', art:10229, slug:'growlithe-hisui', games:['la','sv']}, 'arcanine-hisui':{n:'Hisuian Arcanine', art:10230, games:['la','sv']},

/* ---------------------------------------------------------------- lens rules */
const has = (slug, gid) => (FORMS[slug] ? FORMS[slug].games : MEMBERS[slug].games).includes(gid);
// Reference game: newest standard game that holds it; a non-standard game only if it is the only one.
function refGame(slug) {
  const gs = (FORMS[slug] ? FORMS[slug].games : MEMBERS[slug].games).map(G);
  const std = gs.filter(g => g.std);
  return (std.length ? std : gs).slice(-1)[0];
}
// The screen's one game, and whether we fell back.
function screenGame(slug) {
  if (S.lens !== 'national' && has(slug, S.lens)) return { g: G(S.lens), fallback:false };
  return { g: refGame(slug), fallback: S.lens !== 'national' };
}
// Native form for a species in a game: the dex-listed one, then the regional one, then default.
function nativeForm(sp, gid, dexId) {
  const fs = formsOf(sp).filter(f => has(f, gid));
  if (!fs.length) return DEFAULT(sp);
  const listed = fs.filter(f => FORMS[f].dex && FORMS[f].dex[gid] && (!dexId || FORMS[f].dex[gid][dexId]));
  if (listed.length === 1) return listed[0];
  const regional = { usum:'Alolan', la:'Hisuian', sv:'Paldean', swsh:'Galarian' }[gid];
  const reg = (listed.length ? listed : fs).find(f => FORMS[f].label === regional);
  return reg || (listed[0] || fs[0]);
}
function typesIn(f, g) { return (f.oldTypes && g.gen <= f.oldTypes.maxGen) ? f.oldTypes.types : f.types; }

  let html = `<div class="ab ${lensAware && v === 'B' && gl ? 'tinted' : ''}" ${tint}>${backBtn}<div class="ttl">${title}</div>${right}</div>`;

function contextBar(opts) {

  else if (opts.shown && S.lens === 'national') inner += `<span class="sep">·</span><span>Showing ${opts.shown}</span>`;

function fallbackBanner(name, shown) {

function showingLabel(shown) {

function dexEntries(gid, dexId) {
  if (dexId === 'also') return (ALSO[gid] || []).map(sp => ({ sp, slug: nativeForm(sp, gid), num: null }));
  const out = [];
  SPECIES.forEach(sp => formsOf(sp).forEach(f => { const d = FORMS[f].dex && FORMS[f].dex[gid]; if (d && d[dexId]) out.push({ sp, slug: nativeForm(sp, gid, dexId), num: d[dexId] }); }));
  const seen = new Set(); return out.filter(e => !seen.has(e.sp) && seen.add(e.sp)).sort((a, b) => a.num - b.num);
}
function dexList() {
  const g = G(S.lens); const ids = g.dexes.map(d => d.id); if (ALSO[S.lens]) ids.push('also');
  return ids.map(id => ({ id, label: id === 'also' ? 'Also in this game' : g.dexes.find(d => d.id === id).label }));
}

}
function dexChips() {
  if (S.lens === 'national' || S.variant === 'C' || S.nationalOrder) return '';

}

function dex() {
  let entries, sub = '';
  if (S.lens === 'national') {
    entries = SPECIES.map(sp => ({ sp, slug: DEFAULT(sp), num: FORMS[DEFAULT(sp)].nat })).sort((a, b) => a.num - b.num);
  } else if (S.nationalOrder) {
    const roster = SPECIES.filter(sp => formsOf(sp).some(f => has(f, S.lens)));
    entries = roster.map(sp => ({ sp, slug: nativeForm(sp, S.lens), num: FORMS[DEFAULT(sp)].nat, nat:true })).sort((a, b) => a.num - b.num);
  } else {
    entries = dexEntries(S.lens, S.dexId);
    if (S.dexId === 'also') sub = `<div class="label">Can be held in ${G(S.lens).name} but sits in none of its Pokédexes. National numbers.</div>`;
  }
  const order = S.lens !== 'national' ? `<div class="label"><label><input type="checkbox" ${S.nationalOrder ? 'checked' : ''} onchange="S.nationalOrder=this.checked;render()"> National ordering (setting)</label></div>` : '';
  const cards = entries.map(e => {
    const f = FORMS[e.slug]; const g = S.lens === 'national' ? refGame(e.slug) : G(S.lens);
    const col = TYPE_COLOR[typesIn(f, g)[0]];
    const num = e.num == null || e.nat ? '#' + String(f.nat).padStart(3, '0') : '#' + String(e.num).padStart(3, '0');

  }).join('') || '<div class="muted" style="padding:20px">Nothing from this sample in this dex.</div>';

  const vals = g.gen === 1 ? [f.stats[0], f.stats[1], f.stats[2], f.special ?? f.stats[3], f.stats[5]] : f.stats;

  line.steps.forEach(([a, b, tm], i) => {
    if (i === 0) html += member(a, g);
    const absent = !MEMBERS[b].games.includes(g.id) || !MEMBERS[a].games.includes(g.id);
    html += `<div class="arr"><b>→</b>${absent ? '' : trig(tm, g)}</div>` + member(b, g);
  });
  return html + '</div>';
}
function moveRow(mid, g) {
  const m = MOVES[mid], v = m.games[g.id];
  const cat = g.gen <= 3 && m.cat !== 'Status' ? (SPECIAL_TYPES.includes(m.type) ? 'Special' : 'Physical') : m.cat;
  if (g.cooldowns) return `<div class="mv"><button class="lnk" onclick="go({s:'move',id:'${mid}'})">${m.n}</button><span>${v.p ?? '—'}</span><span>${v.cd}</span><span class="muted">${cat.slice(0,4)}</span></div>`;
  return `<div class="mv"><button class="lnk" onclick="go({s:'move',id:'${mid}'})">${m.n}</button><span>${v.p ?? '—'}</span><span>${v.a}</span><span>${v.pp}</span></div>`;
}
function movesTab(t, f, g) {
  const list = Object.keys(MOVES).filter(mid => (MOVES[mid].learners[g.id] || []).includes(t.slug) || (MOVES[mid].learners[g.id] || []).includes(f.sp));
  const head = g.cooldowns ? `<div class="mv head"><span>Move</span><span>Power</span><span>Cooldown</span><span>Cat.</span></div>`
                           : `<div class="mv head"><span>Move</span><span>Power</span><span>Acc.</span><span>PP</span></div>`;
  return `<div class="muted">${g.name} learnset${g.cooldowns ? ' · no PP or accuracy in this game' : ''}${g.styles ? ' · standard power shown' : ''}</div>` + head + (list.map(mid => moveRow(mid, g)).join('') || '<div class="muted">No sample moves.</div>');
}
function locationTab(t, f, g) {
  const enc = ENC[t.slug] || {};
  if (S.lens === 'national') {
    const rows = ['Switch','3DS','GB'];
    const cells = GAMES.flatMap(G2 => G2.versions.map(v => ({ g:G2, v, ok: !!(enc[G2.id] && enc[G2.id][v] && enc[G2.id][v].length) })));
    const latest = [...cells].reverse().find(c => c.ok);
    const sel = t.ver ? cells.find(c => c.v === t.ver) : latest;
    const code = v => v.split(/[ :/]/).filter(Boolean).map(w => w[0]).join('').slice(0, 2);
    return `<div class="muted">Which game has it? Latest obtainable preselected.</div><div class="ggrid" style="margin-top:8px">${rows.map(r => `<div class="gr"><div class="gl">${r}</div><div class="cells">${cells.filter(c => c.g.console === r).map(c =>
      `<button class="gc ${c.ok ? '' : 'no'} ${sel && c.v === sel.v ? 'sel' : ''}" title="${c.v}" onclick="cur().ver='${c.v}';render()">${code(c.v)}</button>`).join('')}</div></div>`).join('')}</div>` +
      (sel ? encList(sel.g, sel.v, enc, null) : '<div class="muted">Not obtainable in any game in this sample.</div>');
  }
  const ver = t.ver && g.versions.includes(t.ver) ? t.ver : g.versions[0];
  return (g.versions.length > 1 ? `<div class="seg">${g.versions.map(v => `<button class="${v === ver ? 'on' : ''}" onclick="cur().ver='${v}';render()">${v}</button>`).join('')}</div>` : '') +
    encList(g, ver, enc, t.dexId);
}
function encList(g, ver, enc, ctxDex) {
  const rows = (enc[g.id] && enc[g.id][ver]) || [];
  if (!rows.length) return `<div class="muted" style="margin-top:8px">${ver}: transfer it in from another game.</div>`;
  let secs = [...new Set(rows.map(r => r[0]))];
  const ctxLabel = ctxDex && g.dexes.find(d => d.id === ctxDex) ? g.dexes.find(d => d.id === ctxDex).label : null;
  if (ctxLabel) secs.sort((a, b) => (b === ctxLabel) - (a === ctxLabel));
  return `<div class="h">${ver}</div>` + secs.map(s => {
    const dlc = g.dexes.find(d => d.label === s && d.dlc);
    return `<div class="sect" style="padding-left:0">${s}${dlc ? '<span class="dlc">DLC</span>' : ''}</div>` +
      rows.filter(r => r[0] === s).map(r => `<div class="enc"><div><div>${r[1]}</div><div class="muted">${r[2]}</div></div><span class="mchip">${r[3]}</span></div>`).join('');
  }).join('');
}
function moves() {
  const g = S.lens === 'national' ? null : G(S.lens);
  const ids = Object.keys(MOVES).filter(mid => !g || MOVES[mid].games[g.id]);
  const tmSort = cur().tmSort && g;
  const tm = mid => g && TM[g.id] && TM[g.id][mid];
  const sorted = tmSort ? ids.filter(tm).sort((a, b) => String(tm(a)).localeCompare(String(tm(b)), undefined, { numeric:true })) : ids;
  return appBar('Moves', true, { shown: '' }) + `<div class="scroll">
    ${g ? `<div class="label"><label><input type="checkbox" ${tmSort ? 'checked' : ''} onchange="cur().tmSort=this.checked;render()"> Sort by TM number</label></div>` : ''}
    ${sorted.map(mid => { const rg = g || G(Object.keys(MOVES[mid].games).slice(-1)[0]);
      return `<button class="li" onclick="go({s:'move',id:'${mid}'})"><span>${MOVES[mid].n}<div class="meta">${MOVES[mid].type}${tmSort ? ' · ' + tm(mid) : ''}${!g ? ' · as of ' + refMove(mid).name : ''}</div></span><span class="meta">›</span></button>`; }).join('')}
    ${g ? `<div class="note">Moves that don't exist in ${g.name} aren't listed (Hidden Power is gone from Gen 8 on). Search still finds them.</div>` : ''}</div>`;
}
function refMove(mid) { const gs = Object.keys(MOVES[mid].games).map(G); const std = gs.filter(x => x.std); return (std.length ? std : gs).slice(-1)[0]; }
function move() {
  const t = cur(), m = MOVES[t.id];
  const inLens = S.lens !== 'national' && m.games[S.lens];
  const g = inLens ? G(S.lens) : refMove(t.id), fb = S.lens !== 'national' && !inLens, v = m.games[g.id];
  const cat = g.gen <= 3 && m.cat !== 'Status' ? (SPECIAL_TYPES.includes(m.type) ? 'Special' : 'Physical') : m.cat;
  let rows = `<div class="row"><span class="k">Type</span><span>${m.type}</span></div><div class="row"><span class="k">Category</span><span>${cat}${g.gen <= 3 ? ' <span class="muted">(by type)</span>' : ''}</span></div>`;
  rows += `<div class="row"><span class="k">Power</span><span style="text-align:right">${v.p ?? '—'}${g.styles && v.ag ? `<br><span class="muted">Agile ${v.ag} · Strong ${v.st}</span>` : ''}</span></div>`;
  if (g.cooldowns) rows += `<div class="row"><span class="k">Cooldown</span><span>${v.cd}</span></div>`;
  else rows += `<div class="row"><span class="k">Accuracy</span><span>${v.a}</span></div><div class="row"><span class="k">PP</span><span>${v.pp}</span></div>`;
  if (TM[g.id] && TM[g.id][t.id]) rows += `<div class="row"><span class="k">Machine</span><span>${TM[g.id][t.id]} in ${g.name}</span></div>`;
  const learners = (m.learners[g.id] || []).map(s => `<button class="li" onclick="openDetail('${s}', null, true)">${FORMS[s].label && FORMS[s].label !== 'Kanto' ? FORMS[s].label + ' ' : ''}${FORMS[s].name}<span class="meta">›</span></button>`).join('');
  return appBar(m.n, true, { fallback: fb, shown: g.name }) + (fb ? fallbackBanner(m.n, g.name) : '') +
    `<div class="scroll">${showingLabel(g.name)}<div class="body">${rows}<div class="h">Learned by, in ${g.name}</div></div>${learners}
     ${g.cooldowns ? '<div class="note">Z-A has no PP and no accuracy: cooldown takes PP\'s slot and the accuracy row is omitted.</div>' : ''}</div>`;
}
function abilities() {
  const g = S.lens === 'national' ? null : G(S.lens);
  if (g && !g.abilities) {
    return appBar('Abilities', true, {}) + `<div class="scroll"><div class="empty"><div class="big">∅</div>${g.name} has no abilities.<br>${g.gen <= 2 ? 'They were introduced in Ruby/Sapphire.' : 'This game removed them.'}<br><button class="btn" onclick="setLens('national')">See them in National</button></div></div>`;
  }
  const list = ABILITIES.filter(a => !g || a.gen <= g.gen);
  return appBar('Abilities', true, {}) + `<div class="scroll">${list.map(a => `<div class="li"><span>${a.n}<div class="meta">Gen ${a.gen}</div></span></div>`).join('')}</div>`;
}
function locsGate() {
  return appBar('Locations', true, {}) + `<div class="scroll"><div class="empty"><div class="big">🗺</div>Locations are per game.<br><button class="btn" onclick="openPicker('Locations are per game: which one are you playing?')">Choose a game</button></div>
    <div class="note">With no lens, the Locations tile opens the picker; choosing a game sets the lens. The Regions list and region detail are removed.</div></div>`;
}
function locs() {
  const w = WORLD[S.lens] || [];
  return appBar('Locations', true, {}) + `<div class="scroll">${w.map(([sec, ls]) => {
    const dlc = G(S.lens).dexes.find(d => d.label === sec && d.dlc);
    return `<div class="sect">${sec}${dlc ? '<span class="dlc">DLC</span>' : ''}</div>` + ls.map(l => `<div class="li"><span>${l}</span><span class="meta">›</span></div>`).join(''); }).join('')}
    <div class="note">The game's own locations, sectioned by region or DLC area. FireRed's Kanto and Red/Blue's would differ.</div></div>`;
}
function search() {
  const q = S.search.toLowerCase();
  const g = S.lens === 'national' ? null : G(S.lens);
  let poke = Object.keys(FORMS).filter(k => (FORMS[k].label + ' ' + FORMS[k].name).toLowerCase().includes(q));
  let mv = Object.keys(MOVES).filter(k => MOVES[k].n.toLowerCase().includes(q));
  if (g) { poke.sort((a, b) => has(b, g.id) - has(a, g.id)); mv.sort((a, b) => !!MOVES[b].games[g.id] - !!MOVES[a].games[g.id]); }
  const badge = ok => g && !ok ? `<span class="notin">Not in ${g.name}</span>` : '';
  return appBar('Search', true, {}) + `<div class="search"><input id="q" autofocus placeholder="Try: char, vulpix, hidden" value="${S.search}" oninput="S.search=this.value;render();document.getElementById('q').focus();document.getElementById('q').setSelectionRange(99,99)"></div>
    <div class="scroll"><div class="sect">Pokémon</div>${poke.slice(0, 5).map(k => `<button class="li" onclick="openDetail('${k}', null, true)"><span>${FORMS[k].label && FORMS[k].label !== 'Kanto' ? FORMS[k].label + ' ' : ''}${FORMS[k].name}</span>${badge(g && has(k, g.id))}</button>`).join('')}
    <div class="sect">Moves</div>${mv.slice(0, 5).map(k => `<button class="li" onclick="go({s:'move',id:'${k}'})"><span>${MOVES[k].n}</span>${badge(g && MOVES[k].games[g.id])}</button>`).join('')}</div>`;
}

/* ---------------------------------------------------------------- picker */
function openPicker(title) { S.picker = { title: title || 'Which game?' }; render(); }
function picker() {
  if (!S.picker) return '';
  const rows = ['Switch','3DS','DS','GBA','GB'];
  const extra = { DS:['Black/White','HeartGold/SoulSilver','Diamond/Pearl'], GBA:['FireRed/LeafGreen','Ruby/Sapphire'], '3DS':['X/Y','Sun/Moon'], GB:['Gold/Silver','Yellow'], Switch:["Let's Go",'BDSP'] };
  return `<div class="scrim" onclick="if(event.target===this){S.picker=null;render()}"><div class="psheet"><div class="grab"></div>
    <h3>${S.picker.title}</h3><div class="sub">The lens stays on until you change it, and is remembered next time.</div>
    <div class="prow"><div class="opts"><button class="opt ${S.lens === 'national' ? 'on' : ''}" onclick="setLens('national')">National</button></div></div>
    ${rows.map(r => `<div class="prow"><div class="pl">${r}</div><div class="opts">${GAMES.filter(g => g.console === r).map(g => `<button class="opt ${S.lens === g.id ? 'on' : ''}" onclick="setLens('${g.id}')">${g.name}</button>`).join('')}${(extra[r] || []).map(n => `<span class="opt dis">${n}</span>`).join('')}</div></div>`).join('')}
    <div class="setting"><span>National ordering in the dex</span><input type="checkbox" ${S.nationalOrder ? 'checked' : ''} onchange="S.nationalOrder=this.checked;render()"></div>
  </div></div>`;
}

/* ---------------------------------------------------------------- render + switcher */
const SCREENS = { home, dex, detail, moves, move, abilities, 'locs-gate': locsGate, locs, search };
function render() {
  const t = cur(), html = SCREENS[t.s]();
  document.getElementById('phone').innerHTML = (html.startsWith('<div class="screen"') ? html : `<div class="screen">${html}</div>`) + picker();
  document.getElementById('phone').className = 'phone v' + S.variant;
  const v = VARIANTS.find(x => x[0] === S.variant) || VARIANTS[0];
  document.getElementById('vlabel').textContent = `${v[0]} — ${v[1]}`;
}
function cycle(d) {
  const i = VARIANTS.findIndex(x => x[0] === S.variant);
  S.variant = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0];
  const p = new URLSearchParams(location.search); p.set('variant', S.variant); history.replaceState(null, '', '?' + p);
  render();
}
document.getElementById('prev').onclick = () => cycle(-1);
document.getElementById('next').onclick = () => cycle(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
render();
</script>
